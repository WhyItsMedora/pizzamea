<div>
  <form [formGroup]="group">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <app-order-summary [confirmationMode]="false"></app-order-summary>
        </div>
        <div class="col-md-6">
          <app-payment-form [form]="paymentGroup"></app-payment-form>
          <app-customer-info-form [form]="customerInfoGroup"></app-customer-info-form>
          <div class="text-end">
            <button
              type="button"
              class="btn mt-3 mb-4"
              [disabled]="!group.valid || !hasItems"
              (click)="placeOrder()"
            >
              Place Order
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
