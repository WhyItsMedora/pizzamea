<div class="card p-4 mt-4 shadow-sm" [formGroup]="form">
  <div class="mb-3">
    <label class="form-label">Card Number</label>
    <input
      type="number"
      class="form-control"
      placeholder="0000 0000 0000 0000"
      formControlName="cardNumber"
    />
  </div>
  <div class="mb-3">
    <label class="form-label">Card Holder</label>
    <input type="text" class="form-control" placeholder="NAME" formControlName="cardHolder" />
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Exp.</label>
      <input
        type="text"
        class="form-control"
        placeholder="MM/YY"
        formControlName="expirationDate"
      />
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">CVV</label>
      <input type="number" class="form-control" placeholder="000" formControlName="cvv" />
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Postal Code</label>
    <input type="number" class="form-control" placeholder="00000" formControlName="postalCode" />
  </div>
</div>
